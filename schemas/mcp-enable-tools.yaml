overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: MCP Enable Overlay for Feature Flag Tools
  version: 0.0.1
actions:
  - target: $
    update:
      servers:
        - url: https://app.launchdarkly.com
          description: Prod API server
  - target: $["paths"]["/api/v2/flags/{projectKey}"]["get"]
    update:
      x-speakeasy-mcp:
        description: >
          Retrieves all feature flags within a project, including metadata
          and targeting rules. Enables AI agents to enumerate existing flags for inspection,
          configuration analysis, or generating flag usage reports across environments.
        disabled: false
        name: list-feature-flags
        scopes:
          - read
  - target: $["paths"]["/api/v2/flags/{projectKey}"]["post"]
    update:
      x-speakeasy-mcp:
        description: >
          Creates a new feature flag within a project. AI agents can use
          this operation to define feature toggles for controlled rollouts, experimentation,
          or gated features, automating the flag setup process.
        disabled: false
        name: create-feature-flag
        scopes:
          - write
  - target: $["paths"]["/api/v2/flags/{projectKey}/{featureFlagKey}"]["get"]
    update:
      x-speakeasy-mcp:
        description: >
          Fetches the full configuration for a specific feature flag, including
          environments, variations, and targeting rules. Useful for agents auditing
          or managing specific feature toggles in a detailed, contextual manner.
        disabled: false
        name: get-feature-flag
        scopes:
          - read
  - target: $["paths"]["/api/v2/flags/{projectKey}/{featureFlagKey}"]["patch"]
    update:
      x-speakeasy-mcp:
        description: >
          Updates the configuration of an existing feature flag. Enables
          agents to change targeting rules, modify variations, or adapt rollout strategies
          dynamically in response to user behavior or experiment results.
        disabled: false
        name: update-feature-flag
        scopes:
          - write
  - target: $["paths"]["/api/v2/flags/{projectKey}/{featureFlagKey}"]["delete"]
    update:
      x-speakeasy-mcp:
        description: >
          Removes a feature flag from the project. Used by AI agents to clean
          up deprecated toggles that are no longer in use, improving system hygiene
          and maintainability.
        disabled: false
        name: delete-feature-flag
        scopes:
          - write
  - target: $["paths"]["/api/v2/flag-status/{projectKey}/{featureFlagKey}"]["get"]
    update:
      x-speakeasy-mcp:
        description: >
          Returns lifecycle status (new, active, inactive, launched) plus a per-environment
          lastRequested timestamp. This is the key intelligence for removal readiness
          assessment. Important caveat: lastRequested reflects evaluation events, which is
          not the same as "code still references this flag". On client-side SDKs, allFlags()
          and useFlags() emit an evaluation event for every flag in the payload on
          js-client-sdk v3.x and earlier, so a flag marked available to client-side SDKs can
          keep logging evaluations with zero code references. Distinguish the two by context
          kind: identified or logged-in contexts usually mean real variation() calls from
          stale cached SPA bundles, which drain within days of a deploy, whereas a low steady
          floor of anonymous contexts usually means a blanket allFlags() sweep and persists
          until the flag is archived or client-side availability is turned off. Establish code
          truth with check-flag-code-references and get-flag-extinctions rather than inferring
          it from evaluation counts. Before archiving, note that clients still evaluating the
          flag fall back to their compiled-in default variation once it stops being served,
          which can reintroduce the behavior the flag was gating.
        disabled: false
        name: get-flag-status-across-environments
        scopes:
          - read
  - target: $["paths"]["/api/v2/projects/{projectKey}/environments"]["get"]
    update:
      x-speakeasy-mcp:
        description: >
          Identifies which environments exist in a project and determines which are
          marked as "critical" (production, staging, etc.). Allows agents to
          programmatically identify critical environments instead of hardcoding assumptions.
        disabled: false
        name: get-environments
        scopes:
          - read
  - target: $["paths"]["/api/v2/auditlog"]["get"]
    update:
      x-speakeasy-mcp:
        description: >
          Fetches audit log entries for a LaunchDarkly account. Use the `spec` parameter
          with format `proj/<projectKey>:env/<envKey>:flag/<flagKey>` to query a specific
          flag's change history (use `env/*` for all environments). The `before` and `after`
          parameters accept Unix epoch timestamps in milliseconds for date-range filtering.
          Returns at most 20 entries per call, ordered newest-first.
        disabled: false
        name: get-audit-log-entries
        scopes:
          - read
  - target: $["paths"]["/api/v2/code-refs/repositories"]["get"]
    update:
      x-speakeasy-mcp:
        description: >
          Lists the repositories that have LaunchDarkly code-reference scanning enabled,
          along with their branches. IMPORTANT: this endpoint accepts a flagKey parameter but
          the API does not honor it, so the response is identical with and without it. Do not
          use this tool to determine whether a flag has code references; use
          check-flag-code-references instead. Also avoid setting
          withReferencesForDefaultBranch=true, which returns an unfiltered dump of every
          branch in every repository (currently ~11MB) and will exhaust your context without
          returning any per-flag reference data.
        disabled: false
        name: get-code-references
        scopes:
          - read
  - target: $["paths"]["/api/v2/code-refs/statistics/{projectKey}"]["get"]
    update:
      x-speakeasy-mcp:
        description: >
          Answers whether a flag still has code references. Pass projectKey plus the flagKey
          query parameter. Returns a flags map keyed by flag key, where each entry lists the
          repositories containing references along with hunkCount, fileCount, and
          latestCommitTime. An empty flags object means the flag has zero code references and
          is dead code. This is the correct flag-scoped tool for code-reference checks and
          flag-cleanup sweeps, and responses are small (about 100 bytes when empty). Prefer
          this over get-code-references, which cannot filter by flag.
        disabled: false
        name: check-flag-code-references
        scopes:
          - read
  - target: $["paths"]["/api/v2/code-refs/extinctions"]["get"]
    update:
      x-speakeasy-mcp:
        description: >
          Returns the commit that removed a flag's last code reference, including the commit
          SHA (revision), the full commit message, the repository name, and the extinction
          timestamp in Unix epoch milliseconds. Filter with projKey and flagKey, and
          optionally repoName, branchName, from, and to. Use this to date when a flag became
          dead code instead of doing git archaeology such as git log -S across source
          repositories. Pair it with check-flag-code-references, which confirms there are
          zero current references, and get-flag-status-across-environments, whose
          lastRequested shows whether anything is still evaluating the flag.
        disabled: false
        name: get-flag-extinctions
        scopes:
          - read
  - target: $["paths"]["/api/v2/projects/{projectKey}/ai-configs"]["get"]
    update:
      x-speakeasy-mcp:
        description: >
          Retrieves AI configuration settings for a specific project. This
          endpoint allows agents to access and modify AI-related configurations, ensuring
          that the AI's behavior aligns with project requirements and user expectations.
        disabled: false
        name: list-ai-configs
        scopes:
          - read
  - target: $["paths"]["/api/v2/projects/{projectKey}/ai-configs"]["post"]
    update:
      x-speakeasy-mcp:
        name: create-ai-config
        description: >
          Creates a new AI Config within a project. Useful for setting up LLM
          configurations programmatically.
        disabled: false
        scopes:
          - write
  - target: $["paths"]["/api/v2/projects/{projectKey}/ai-configs/{configKey}"]["get"]
    update:
      x-speakeasy-mcp:
        name: get-ai-config
        description: Retrieves details of a specific AI Config, including variations and model settings.
        disabled: false
        scopes:
          - read
  - target: $["paths"]["/api/v2/projects/{projectKey}/ai-configs/{configKey}"]["patch"]
    update:
      x-speakeasy-mcp:
        name: update-ai-config
        description: Updates metadata or configuration of an existing AI Config.
        disabled: false
        scopes:
          - write
  - target: $["paths"]["/api/v2/projects/{projectKey}/ai-configs/{configKey}"]["delete"]
    update:
      x-speakeasy-mcp:
        name: delete-ai-config
        description: >
          Deletes an AI Config and its associated variations. Intended for
          cleanup or deprecation workflows.
        disabled: false
        scopes:
          - write
  - target: $["paths"]["/api/v2/projects/{projectKey}/ai-configs/{configKey}/targeting"]["get"]
    update:
      x-speakeasy-mcp:
        name: get-ai-config-targeting
        description: Retrieves the targeting details of a specific AI Config, including individual targets, rules, and rollouts.
        disabled: false
        scopes:
          - read
  - target: $["paths"]["/api/v2/projects/{projectKey}/ai-configs/{configKey}/targeting"]["patch"]
    update:
      x-speakeasy-mcp:
        name: update-ai-config-targeting
        description: Updates the targeting of an existing AI Config.
        disabled: false
        scopes:
          - write
  - target: $["paths"]["/api/v2/projects/{projectKey}/ai-configs/{configKey}/variations/{variationKey}"]["get"]
    update:
      x-speakeasy-mcp:
        name: get-ai-config-variation
        description: Retrieves an AI configuration variation.
        disabled: false
        scopes:
          - read
  - target: $["paths"]["/api/v2/projects/{projectKey}/ai-configs/{configKey}/variations"]["post"]
    update:
      x-speakeasy-mcp:
        name: create-ai-config-variation
        description: >
          Adds a new variation to an AI Config, supporting experimentation or
          multi-model strategies.
        disabled: false
        scopes:
          - write
  - target: $["paths"]["/api/v2/projects/{projectKey}/ai-configs/{configKey}/variations/{variationKey}"]["patch"]
    update:
      x-speakeasy-mcp:
        name: update-ai-config-variation
        description: >
          Updates a specific variation within an AI Config. Enables fine-tuned
          control of model behavior.
        disabled: false
        scopes:
          - write
  - target: $["paths"]["/api/v2/projects/{projectKey}/ai-configs/{configKey}/variations/{variationKey}"]["delete"]
    update:
      x-speakeasy-mcp:
        name: delete-ai-config-variation
        description: Deletes an AI Config variation.
        disabled: false
        scopes:
          - write
  - target: $.paths.*[?@['x-speakeasy-mcp'].disabled != false]
    update:
      x-speakeasy-ignore: true

